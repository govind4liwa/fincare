name: Bug Report
description: Report a defect in FinCare
title: "[BUG] "
labels: ["bug", "triage"]
assignees:
  - govind4liwa
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please complete all sections to help us reproduce and fix it.

  - type: input
    id: module
    attributes:
      label: Affected Module
      description: Which FinCare module is affected?
      placeholder: e.g. ledger, ar, tax, fleet
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered, exact steps
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S1 — Production down / data corruption
        - S2 — Major function broken, no workaround
        - S3 — Function broken, workaround exists
        - S4 — Cosmetic / minor
    validations:
      required: true

  - type: dropdown
    id: financial-impact
    attributes:
      label: Financial Impact
      description: Does this affect ledger balances, tax calculations, or reported figures?
      options:
        - "No"
        - "Yes — incorrect figures on report"
        - "Yes — incorrect GL posting"
        - "Yes — VAT / tax calculation"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Branch / commit:
        - Python version:
        - Postgres version:
        - Browser (if frontend):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
