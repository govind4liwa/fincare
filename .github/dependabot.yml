version: 2
updates:
  # --- Python dependencies ---
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "govind4liwa"
    groups:
      django-ecosystem:
        patterns:
          - "django*"
          - "djangorestframework*"
          - "drf-*"
      celery-ecosystem:
        patterns:
          - "celery*"
          - "redis"
          - "django-celery-*"
      dev-tools:
        patterns:
          - "ruff"
          - "black"
          - "isort"
          - "mypy*"
          - "pytest*"
          - "factory-boy"
          - "faker"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"

  # --- Docker base images ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Dubai"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
