# ============================================================
# FinCare — Local Development Stack
# Postgres 16 + Redis 7 + Django (dev server) + Celery worker
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: fincare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincare}
      POSTGRES_USER: ${POSTGRES_USER:-fincare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincare_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincare} -d ${POSTGRES_DB:-fincare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fincare-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fincare-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: fincare.settings.dev
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fincare-celery-worker
    restart: unless-stopped
    command: celery -A fincare worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: fincare.settings.dev
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: fincare-celery-beat
    restart: unless-stopped
    command: celery -A fincare beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: fincare.settings.dev
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: fincare_postgres_data
  redis_data:
    name: fincare_redis_data
  static_volume:
    name: fincare_static
  media_volume:
    name: fincare_media
